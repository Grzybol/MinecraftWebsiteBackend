version: "3.9"

services:
  backend:
    build: .
    network_mode: host
    environment:
      PORT: "8443"
      RESTART_INTERVAL_SECONDS: "86400"
      MONGO_URI: "${MONGO_URI:-mongodb://localhost:27017}"
      MARIADB_BASE_URI: "${MARIADB_BASE_URI:-groupmanager:j63h9fMKovV4YHWIR1Yy@tcp(127.0.0.1:3306)/}"
      TLS_CERT_PATH: /certs/fullchain.pem
      TLS_KEY_PATH: /certs/privkey.pem
    volumes:
      - /etc/ssl/myapp/fullchain.pem:/certs/fullchain.pem:ro
      - /etc/ssl/myapp/privkey.pem:/certs/privkey.pem:ro
    restart: always
